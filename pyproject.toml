[project]
name = "snmp-mikrotik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pysnmp>=7.1.28",
]

[project.scripts]
snmp-mikrotik = "snmp_mikrotik:main"

[project.optional-dependencies]
gui = [
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
